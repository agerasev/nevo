[workspace]
members = ["api", "core", "ui", "utils", "worlds/quad"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
nevo-core = { path = "core" }
nevo-api = { path = "api" }
nevo-ui = { path = "ui" }
nevo-utils = { path = "utils" }
rand = "0.8.5"
rand_distr = "0.4.3"
glam = "0.29.2"
candle = { package = "candle-core", version = "0.8.3" }
candle-nn = "0.8.3"
anyhow = "1.0"
eframe = "0.31.0"
