[package]
name = "nevo"
version = "0.1.0"
edition = "2024"
default-run = "nevo"

[features]
default = ["viewer"]
viewer = ["dep:wgame", "dep:wgame-egui"]

[[bin]]
name = "nevo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
conf = { version = "0.4.5", features = ["serde"] }
toml = "1.1.8"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
wgame = { path = "wgame/wgame", optional = true }
wgame-egui = { path = "wgame/wgame-egui", optional = true }
rand = { version = "0.10.2", default-features = false, features = ["std", "sys_rng"] }
rand_xoshiro = { version = "0.8.1", features = ["serde"] }
glam = { version = "0.33.7", features = ["rand", "serde"] }

[dev-dependencies]
futures = { version = "0.3.34", features = ["executor"] }
wgpu = { version = "30.0.1", default-features = false }
