[package]
name = "nevo"
version = "0.1.0"
edition = "2024"
default-run = "nevo"

[features]
default = ["viewer"]
viewer = ["dep:wgame", "dep:wgame-egui", "dep:egui_plot"]

[[bin]]
name = "nevo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
ciborium = "0.2.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
jiff = "0.2.37"
wgame = { path = "wgame/wgame", optional = true }
wgame-egui = { path = "wgame/wgame-egui", optional = true }
egui_plot = { version = "0.37.0", optional = true }
rand = { version = "0.10.2", default-features = false, features = ["std", "sys_rng"] }
libm = "0.2.16"
rand_xoshiro = { version = "0.8.1", features = ["serde"] }
glam = { version = "0.33.7", features = ["rand", "serde"] }
phy = { path = "phy" }
geom2 = { path = "geom2" }

[dev-dependencies]
futures = { version = "0.3.34", features = ["executor"] }
wgpu = { version = "30.0.1", default-features = false }
